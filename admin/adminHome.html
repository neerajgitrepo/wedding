<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Wedding Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #fceff9, #e1f7f5);
      font-family: 'Segoe UI', sans-serif;
    }
    .sidebar {
      background-color: #2d2d30;
      min-height: 100vh;
      padding-top: 30px;
      color: white;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    }
    .sidebar h5 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .sidebar a {
      display: block;
      padding: 10px 20px;
      color: white;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .sidebar a:hover {
      background-color: #444;
      border-left: 4px solid #ff70a6;
    }
    .topbar {
      background-color: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }
    .notification span {
      margin-right: 20px;
      color: #dc3545;
      font-weight: 500;
    }
    .card-style {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(5px);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
    }
    .btn-upload {
      background-color: #ff70a6;
      color: white;
      border: none;
      width: 100%;
    }
    .btn-upload:hover {
      background-color: #e55b90;
    }
    .logout-link {
      color: #dc3545;
      font-weight: bold;
      text-decoration: none;
    }
    .logout-link:hover {
      text-decoration: underline;
    }
    .upload-icon {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-2 sidebar">
        <h5>Wedding Admin</h5>
        <a href="adminHome.html"><i class="bi bi-house-door-fill"></i> Dashboard</a>
        <a href="users.html"><i class="bi bi-people-fill"></i> Users</a>
        <!-- <a href="albums.html"><i class="bi bi-camera-fill"></i> Albums</a>
        <a href="videos.html"><i class="bi bi-play-btn-fill"></i> Videos</a> -->
        <a href="photos.html"><i class="bi bi-calendar-event-fill"></i> Photos</a>
        <a href="weddingShorts.html"><i class="bi bi-calendar-event-fill"></i> Wedding Shorts</a>
        <a href="preWeddingShorts.html"><i class="bi bi-calendar-event-fill"></i> Pre Wedding Shorts</a>
      </div>

      <!-- Main Content -->
      <div class="col-md-10">
    
     <!-- Top Bar -->
<div class="topbar shadow-sm rounded-3 mt-3 mx-3 d-flex flex-wrap justify-content-between align-items-center" style="background: linear-gradient(90deg, #a8edea, #fed6e3);">
    <div class="p-2">
      <h5 class="mb-0 fw-bold text-dark">👋 Welcome, Admin</h5>
    </div>
  
    <div class="p-2 d-flex flex-wrap gap-2">
      <span class="badge bg-danger text-white p-2 rounded-pill">
        <i class="bi bi-people-fill me-1"></i> Users: 60
      </span>
      <span class="badge bg-primary text-white p-2 rounded-pill">
        <i class="bi bi-images me-1"></i> Albums: 55
      </span>
      <span class="badge bg-success text-white p-2 rounded-pill">
        <i class="bi bi-film me-1"></i> Wedding Videos: 58
      </span>
  
      <!-- Special Button-style Event Request -->
      <a href="#event-requests" class="btn btn-warning text-dark fw-semibold px-3 py-2 rounded-pill d-flex align-items-center">
        <i class="bi bi-calendar-event-fill me-2"></i> Event Requests
      </a>
    </div>
  
    <div class="p-2">
      <a href="#" class="logout-link">Logout</a>
    </div>
  </div>
  
  
        <!-- Upload Cards -->
         <!-- photo upload   -->
        <div class="container mt-4">
          <div class="row g-4">
            <div class="col-md-6">
              <div class="card-style">
                <h5>Photo Shoot Upload</h5>
                <form>
                  <input type="file" class="form-control mb-3">
                  <button type="submit" name="photoUpload" class="btn btn-upload" style="background-color:chartreuse;"><i class="bi bi-upload upload-icon"></i>Upload</button>
                </form>
              </div>
            </div>

            <div class="col-md-6" aria-disabled>
              <div class="card-style">
                <h5>Extra</h5>
                <form>
                  <input type="file" class="form-control mb-3" disabled>
                  <button class="btn btn-upload" style="background-color: darkorange;" disabled><i class="bi bi-upload upload-icon"></i>Upload</button>
                </form>
              </div>
            </div>
          </div>
        </div>
        <br>
        <!-- video upload  -->
        <div class="container mt-4">
          <div class="row g-4">
            <div class="col-md-6">
              <div class="card-style">
                <h5>Wedding Short Upload</h5>
                <form>
                  <input type="file" class="form-control mb-3">
                  <button type="submit" name="weddingShortUpload" class="btn btn-upload"><i class="bi bi-upload upload-icon"></i>Upload</button>
                </form>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card-style">
                <h5>PreWedding Short Upload</h5>
                <form>
                  <input type="file" class="form-control mb-3">
                  <button type="submit" name="PreWeddingUpload" class="btn btn-upload"><i class="bi bi-upload upload-icon"></i>Upload</button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <!-- Album upload   -->
        <div class="container mt-4">
          <div class="row g-4">
            <div class="col-md-6">
              <div class="card-style">
                <h5>Album Upload</h5>
                <form>
                  <input type="file" name="album[]" class="form-control mb-3" multiple>
                  <label for="albumId" class="form-control-label">Customer Mobile Number</label>
                  <input id="albumId" type="number" name="user" class="form-control mb-3">
                  <button type="submit" name="albumUpload" class="btn btn-upload" style="background-color:chartreuse;"><i class="bi bi-upload upload-icon"></i>Upload</button>
                </form>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card-style">
                <h5>Wedding Video Upload</h5>
                <form>
                  <input type="file" class="form-control mb-3">
                  <label for="albumId" class="form-control-label">Customer Mobile Number</label>
                  <input id="videoId" type="number" name="user" class="form-control mb-3">
                  <button type="submit" name="videoUpload" class="btn btn-upload"><i class="bi bi-upload upload-icon"></i>Upload</button>
                </form>
              </div>
            </div>
            
          </div>
        </div>
        <br>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
