<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Wedding Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .carousel-container {
      width: 90%;
      margin: auto;
      margin-bottom: 60px;
      position: relative;
    }
    .carousel-item img,
    .carousel-item video {
      width: 100%;
      height: 450px;
      object-fit: cover;
      border-radius: 12px;
    }
    .section-title {
      text-align: center;
      margin: 40px 0 20px;
      font-weight: 600;
      font-size: 1.5rem;
      border-bottom: 2px solid #ccc;
      display: inline-block;
      padding-bottom: 8px;
    }
    .carousel-control-prev span,
    .carousel-control-next span {
      color: #000;
      font-size: 3rem;
    }
    .carousel-control-prev,
    .carousel-control-next {
      width: 5%;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <h2 class="text-center mb-4">🎉 Welcome, [User Name]</h2>

  <!-- 🖼️ Wedding Album Carousel -->
  <h4 class="section-title">📸 Your Wedding Album</h4>
  <div class="carousel-container">
    <div id="albumCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://images.unsplash.com/photo-1609951731520-dbe5fef338fd?auto=format&fit=crop&w=1200&q=80" alt="Photo 1">
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1585155773489-b834cac9f832?auto=format&fit=crop&w=1200&q=80" alt="Photo 2">
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1521566652839-697aa4737616?auto=format&fit=crop&w=1200&q=80" alt="Photo 3">
        </div>
        <div class="carousel-item">
          <img src="https://images.unsplash.com/photo-1585155773495-723b393e1bfc?auto=format&fit=crop&w=1200&q=80" alt="Photo 4">
        </div>
      </div>
      <!-- Prev Button -->
      <button class="carousel-control-prev" type="button" data-bs-target="#albumCarousel" data-bs-slide="prev">
        <span aria-hidden="true">&#10094;</span>
      </button>
      <!-- Next Button -->
      <button class="carousel-control-next" type="button" data-bs-target="#albumCarousel" data-bs-slide="next">
        <span aria-hidden="true">&#10095;</span>
      </button>
    </div>
  </div>

  <!-- 🎥 Wedding Short Video -->
  <h4 class="section-title">🎥 Your Wedding Video</h4>
  <div class="carousel-container">
    <div id="videoCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="false">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <video controls muted>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
