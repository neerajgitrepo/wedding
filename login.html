<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #f8e1f4, #fdeff9);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      padding: 2rem;
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-primary {
      background-color: #ff6fa1;
      border: none;
      border-radius: 10px;
    }
    .btn-primary:hover {
      background-color: #e95f90;
    }
    .logo {
      font-size: 2rem;
      font-weight: bold;
      color: #ff6fa1;
      margin-bottom: 1rem;
    }
    .form-text {
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card p-4">
          <div class="text-center logo">💍 Wedding Studio</div>
          <h4 class="text-center mb-4">Login to your account</h4>
          <form>
            <div class="mb-3">
              <label for="mobile" class="form-label">Mobile Number</label>
              <input type="tel" class="form-control" id="mobile" placeholder="Enter mobile number" pattern="[0-9]{10}" required>
              <div class="form-text">Enter your 10-digit mobile number. Example: 9876543210</div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Password">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Login</button>
            </div>
          </form>
          <p class="text-center mt-3 text-muted">Don't have an account? <a href="#">Register</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
